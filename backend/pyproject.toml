[project]
name = "nextharvest-backend"
version = "0.1.0"
description = "NextHarvest API: crop-rotation decision support with NASA and USDA data."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "geoalchemy2>=0.16",
    "httpx>=0.27",
    "redis>=5.2",
    "numpy>=2.1",
    "pandas>=2.2",
    "xarray>=2024.9",
    "shapely>=2.0",
    "pyproj>=3.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: calls NASA POWER or USDA SDA (set NEXTHARVEST_LIVE=1)",
]
