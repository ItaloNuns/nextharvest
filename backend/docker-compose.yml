services:
  postgres:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_USER: nextharvest
      POSTGRES_PASSWORD: nextharvest
      POSTGRES_DB: nextharvest
    ports:
      - "5433:5432"
    volumes:
      - nextharvest_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextharvest -d nextharvest"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nextharvest_pg:
